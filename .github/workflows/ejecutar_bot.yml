name: Ejecutar Bot de Analisis Deportivo 8:00 AM

on:
  schedule:
    # 8:00 AM hora de Colombia (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI

      - name: Ejecutar motor de analisis de Python
        run: python análisis_futbol_prepartido.py
