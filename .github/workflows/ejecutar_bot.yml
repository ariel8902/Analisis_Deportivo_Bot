name: Ejecutar Bot de Análisis Deportivo 8:00 AM

on:
  schedule:
    # 13:00 UTC = 08:00 AM Hora Colombia (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions en GitHub

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Oficiales de Google Gemini
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Ejecutar motor de análisis de Python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python analisis_futbol_prepartido.py
