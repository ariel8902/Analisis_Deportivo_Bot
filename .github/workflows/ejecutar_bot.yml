name: Ejecutar Bot de Analisis Deportivo 8:00 AM

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI google-genai requests

      - name: Ejecutar motor de analisis de Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analisis_futbol_prepartido.py
