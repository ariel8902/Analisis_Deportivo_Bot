name: Ejecutar Bot de Analisis Deportivo

on:
  schedule:
    # 13:00 UTC equivale a las 08:00 AM Hora Colombia (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  analisis_futbol:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ejecutar motor de analisis de Python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN_FUTBOL: ${{ secrets.TELEGRAM_TOKEN_FUTBOL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FUTBOL: ${{ secrets.TELEGRAM_CHAT_ID_FUTBOL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analisis_futbol_prepartido.py
